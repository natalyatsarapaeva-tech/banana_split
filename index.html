html,body{margin:0;height:100%;background:#2b1b26;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:Nunito,'Trebuchet MS',system-ui,sans-serif}
#stage{position:absolute;overflow:hidden;--u:1;border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.45)}
#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;color:#5a2c12}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:fade .25s ease}
.scr.dim{background:rgba(43,20,32,.45)}
@keyframes fade{from{opacity:0}to{opacity:1}}
button{font:900 calc(var(--u)*20px)/1.1 Nunito,'Trebuchet MS',sans-serif;padding:calc(var(--u)*11px) calc(var(--u)*26px);border-radius:calc(var(--u)*999px);
  border:calc(var(--u)*3px) solid #6a3214;background:linear-gradient(#ffe88a,#f5b43a);color:#5a2c12;box-shadow:0 calc(var(--u)*5px) 0 #6a3214;cursor:pointer;
  min-width:calc(var(--u)*230px);transition:transform .08s ease, filter .08s ease;letter-spacing:.01em}
button:active{transform:translateY(calc(var(--u)*3px));box-shadow:0 calc(var(--u)*2px) 0 #6a3214}
button.foc{transform:translateY(calc(var(--u)*-2px)) scale(1.04);filter:brightness(1.06);outline:calc(var(--u)*4px) solid #fff;outline-offset:calc(var(--u)*2px)}
button.ghost{background:linear-gradient(#fffaf2,#f1dcc6);min-width:calc(var(--u)*150px)}
.menu{display:flex;flex-direction:column;gap:calc(var(--u)*13px);align-items:center}
.menu.row{flex-direction:row;justify-content:center;gap:calc(var(--u)*16px);margin-top:calc(var(--u)*14px)}
.menu.grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*12px) calc(var(--u)*14px)}
.menu.grid button{min-width:0;width:100%;font-size:calc(var(--u)*17px);padding:calc(var(--u)*10px) calc(var(--u)*14px)}
.card.wide{max-width:calc(var(--u)*640px)}
.menu.bottom{position:absolute;top:calc(var(--u)*218px);left:0;right:0}
.foot{position:absolute;bottom:calc(var(--u)*8px);left:0;right:0;text-align:center;font:800 calc(var(--u)*12px) Nunito,sans-serif;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card{background:#fff8ec;border:calc(var(--u)*4px) solid #c98b4e;border-radius:calc(var(--u)*28px);padding:calc(var(--u)*22px) calc(var(--u)*30px);max-width:calc(var(--u)*540px);text-align:center;box-shadow:0 calc(var(--u)*10px) 0 rgba(106,50,20,.35)}
.card.glow{box-shadow:0 0 calc(var(--u)*40px) rgba(255,230,120,.9),0 calc(var(--u)*10px) 0 rgba(106,50,20,.35)}
.card h2,.panel h2{font:900 calc(var(--u)*32px)/1.1 Nunito,sans-serif;margin:calc(var(--u)*4px) 0 calc(var(--u)*14px);color:#6a3214}
.card p{font:800 calc(var(--u)*17px)/1.4 Nunito,sans-serif;margin:calc(var(--u)*8px) 0}
p.small{font-size:calc(var(--u)*13px);opacity:.8}
.lvl{font:900 calc(var(--u)*15px) Nunito,sans-serif;color:#c97a3a;text-transform:uppercase;letter-spacing:.08em}
.paper{background:#fffdf4;background-image:repeating-linear-gradient(transparent 0 calc(var(--u)*29px),rgba(226,54,60,.18) calc(var(--u)*29px) calc(var(--u)*30px));border-radius:calc(var(--u)*6px);
  padding:calc(var(--u)*22px) calc(var(--u)*32px);max-width:calc(var(--u)*520px);transform:rotate(-1.2deg);box-shadow:0 calc(var(--u)*12px) calc(var(--u)*30px) rgba(0,0,0,.35);border-left:calc(var(--u)*6px) solid #e2363c}
.paper.side{position:absolute;right:calc(var(--u)*28px);top:calc(var(--u)*40px);max-width:calc(var(--u)*380px)}
.paper p{font:800 calc(var(--u)*19px)/calc(var(--u)*30px) Nunito,sans-serif;margin:0;color:#4a2a14;font-style:italic}
.ptitle{font:900 calc(var(--u)*14px) Nunito,sans-serif;color:#e2363c;text-transform:uppercase;letter-spacing:.1em;margin-bottom:calc(var(--u)*6px)}
.tbc{font-style:normal!important;font-weight:900!important;color:#c97a3a!important;margin-top:calc(var(--u)*12px)!important}
.caption{position:absolute;left:calc(var(--u)*30px);right:calc(var(--u)*30px);top:calc(var(--u)*16px);background:rgba(255,248,236,.95);border:calc(var(--u)*4px) solid #c98b4e;border-radius:calc(var(--u)*24px);padding:calc(var(--u)*14px) calc(var(--u)*24px)}
.caption p{font:800 calc(var(--u)*19px)/1.4 Nunito,sans-serif;margin:0 0 calc(var(--u)*4px)}
.caption .menu.row{justify-content:flex-end;margin-top:calc(var(--u)*6px)}
.caption button{min-width:calc(var(--u)*150px);font-size:calc(var(--u)*17px);padding:calc(var(--u)*8px) calc(var(--u)*20px)}
.panel{position:absolute;right:calc(var(--u)*24px);top:50%;transform:translateY(-50%);width:calc(var(--u)*330px);background:#fff8ec;border:calc(var(--u)*4px) solid #c98b4e;border-radius:calc(var(--u)*26px);padding:calc(var(--u)*16px) calc(var(--u)*18px);text-align:center;box-shadow:0 calc(var(--u)*10px) 0 rgba(106,50,20,.3)}
.panel h2{font-size:calc(var(--u)*26px);margin-bottom:calc(var(--u)*10px)}
.thumb{width:100%;border-radius:calc(var(--u)*14px);border:calc(var(--u)*3px) solid #e8c9a0;display:block}
.stats{display:flex;flex-direction:column;gap:calc(var(--u)*2px);font:800 calc(var(--u)*15px) Nunito,sans-serif;margin:calc(var(--u)*10px) 0 calc(var(--u)*12px)}
.lock{font:800 calc(var(--u)*17px)/1.4 Nunito,sans-serif;margin:calc(var(--u)*14px) 0}
.mapnodes .node{position:absolute;width:calc(var(--u)*52px);height:calc(var(--u)*52px);border-radius:50%;cursor:pointer}
.maphint{position:absolute;left:calc(var(--u)*16px);bottom:calc(var(--u)*10px);font:800 calc(var(--u)*13px) Nunito,sans-serif;color:#6a3214;opacity:.75}
.tally{display:flex;flex-direction:column;gap:calc(var(--u)*6px);margin:calc(var(--u)*6px) 0 calc(var(--u)*10px)}
.tally div{display:flex;justify-content:space-between;gap:calc(var(--u)*30px);font:800 calc(var(--u)*18px) Nunito,sans-serif;border-bottom:calc(var(--u)*2px) dashed #ead2b2;padding-bottom:calc(var(--u)*4px)}
.tally b{font-weight:900;color:#6a3214}
.tally small{font-size:.75em;color:#c97a3a}
/* touch */
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#touch .dpad{position:absolute;left:calc(var(--u)*16px);bottom:calc(var(--u)*16px);width:calc(var(--u)*250px);height:calc(var(--u)*112px);pointer-events:auto;touch-action:none;display:flex;gap:calc(var(--u)*8px)}
#touch .dpad i{flex:1;border-radius:calc(var(--u)*26px);background:rgba(255,248,236,.42);border:calc(var(--u)*3px) solid rgba(106,50,20,.45);display:flex;align-items:center;justify-content:center;font:900 calc(var(--u)*34px) Nunito,sans-serif;color:rgba(106,50,20,.75);font-style:normal}
#touch .dpad .ud{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*6px)}
#touch .dpad .ud i{font-size:calc(var(--u)*24px);border-radius:calc(var(--u)*18px)}
#touch .dpad[data-l="true"] i.l,#touch .dpad[data-r="true"] i.r,#touch .dpad[data-d="true"] i.d,#touch .dpad[data-u="true"] i.u{background:rgba(255,230,140,.75)}
#touch .tb.sw{right:calc(var(--u)*126px);bottom:calc(var(--u)*130px);width:calc(var(--u)*60px);height:calc(var(--u)*60px);font-size:calc(var(--u)*28px);display:none}
.scr.dimlight{background:rgba(43,20,32,.25)}
.dlg{position:absolute;left:calc(var(--u)*30px);right:calc(var(--u)*30px);bottom:calc(var(--u)*20px);display:flex;gap:calc(var(--u)*16px);align-items:center;background:rgba(255,248,236,.97);border:calc(var(--u)*4px) solid #c98b4e;border-radius:calc(var(--u)*26px);padding:calc(var(--u)*12px) calc(var(--u)*20px)}
.dlg .portrait{width:calc(var(--u)*120px);height:calc(var(--u)*120px);flex:none;border-radius:50%;border:calc(var(--u)*3px) solid #c98b4e}

<script>
(function(){
'use strict';
// ================= core.js : utils, save, input, audio =================
const T = 40;            // tile size (logical px)
const VIEW_H = 540;      // logical view height
const DT = 1 / 60;       // fixed physics step
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => (v < 0 ? -1 : v > 0 ? 1 : 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function approach(v, target, d) { return v < target ? Math.min(v + d, target) : Math.max(v - d, target); }
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ---------------- Save ----------------
const Save = {
  key: 'banni-split-v1',
  data: null,
  defaults() {
    return {
      unlocked: 1, done: {}, cherries: { 1: [0, 0, 0], 2: [0, 0, 0], 3: [0, 0, 0], 4: [0, 0, 0], 5: [0, 0, 0] }, notes: {}, sheep: {}, best: {},
      wallJump: false, introSeen: false,
      settings: { music: 0.6, sfx: 0.8, easy: false, touch: 'auto' }
    };
  },
  load() {
    const d = this.defaults();
    try {
      const s = localStorage.getItem(this.key);
      const p = s ? JSON.parse(s) : {};
      this.data = Object.assign(d, p);
      this.data.settings = Object.assign(this.defaults().settings, p.settings || {});
      this.data.cherries = Object.assign(this.defaults().cherries, p.cherries || {});
    } catch (e) { this.data = d; }
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
  reset() { const s = this.data.settings; this.data = this.defaults(); this.data.settings = s; this.save(); }
};

// ---------------- Input ----------------
const KEYMAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  jump: ['Space', 'KeyZ', 'ArrowUp', 'KeyW'], jumpBtn: ['Space', 'KeyZ'],
  fire: ['KeyX', 'KeyJ', 'ShiftLeft', 'ShiftRight'], pickle: ['KeyC', 'KeyK'], swap: ['KeyV', 'KeyQ'],
  pause: ['Escape', 'KeyP'], confirm: ['Enter', 'Space', 'KeyZ', 'NumpadEnter'], back: ['Escape', 'Backspace']
};
const ACTIONS = Object.keys(KEYMAP);
const Input = {
  keys: Object.create(null), latch: Object.create(null),
  touch: Object.create(null), padState: Object.create(null),
  cur: Object.create(null), prev: Object.create(null),
  lastDevice: IS_TOUCH ? 'touch' : 'kbd',
  init() {
    window.addEventListener('keydown', e => {
      if (e.code === 'Tab') return;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (!this.keys[e.code]) this.latch[e.code] = true;
      this.keys[e.code] = true; this.lastDevice = 'kbd';
      Audio2.unlock();
    }, { passive: false });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = Object.create(null); for (const k in this.touch) this.touch[k] = false; });
  },
  rawHeld(a) {
    for (const c of KEYMAP[a]) if (this.keys[c] || this.latch[c]) return true;
    if (this.touch[a] || this.padState[a]) return true;
    if (a === 'jumpBtn' && (this.touch.jump || this.padState.jump)) return true;
    if (a === 'confirm' && (this.padState.jump)) return true;
    return false;
  },
  pollPad() {
    const ps = this.padState; for (const k in ps) ps[k] = false;
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { pads = []; }
    for (const p of pads) {
      if (!p || !p.connected) continue;
      const b = i => p.buttons[i] && p.buttons[i].pressed;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      const any = b(0) || b(1) || b(2) || b(3) || b(9) || b(12) || b(13) || b(14) || b(15) || Math.abs(ax) > 0.5 || Math.abs(ay) > 0.5;
      if (any) this.lastDevice = 'pad';
      ps.left = ps.left || b(14) || ax < -0.4; ps.right = ps.right || b(15) || ax > 0.4;
      ps.up = ps.up || b(12) || ay < -0.6; ps.down = ps.down || b(13) || ay > 0.6;
      ps.jump = ps.jump || b(0); ps.fire = ps.fire || b(2) || b(1); ps.pickle = ps.pickle || b(3);
      ps.pause = ps.pause || b(9); ps.back = ps.back || b(1); ps.swap = ps.swap || b(5) || b(4);
    }
  },
  // call once per fixed step
  update() {
    this.pollPad();
    for (const a of ACTIONS) { this.prev[a] = this.cur[a]; this.cur[a] = this.rawHeld(a); }
    this.latch = Object.create(null);
  },
  held(a) { return !!this.cur[a]; },
  pressed(a) { return !!this.cur[a] && !this.prev[a]; },
  clear() { for (const a of ACTIONS) { this.prev[a] = true; } this.latch = Object.create(null); },
  label(kind) {
    const d = this.lastDevice;
    const L = {
      move: d === 'touch' ? '◀ ▶' : d === 'pad' ? 'крестовина' : '← →',
      jump: d === 'touch' ? '⤒' : d === 'pad' ? 'A' : 'ПРОБЕЛ',
      down: d === 'touch' ? '▼' : d === 'pad' ? '↓' : '↓',
      fire: d === 'touch' ? '🍒' : d === 'pad' ? 'X' : 'X',
      pickle: d === 'touch' ? '🥒' : d === 'pad' ? 'Y' : 'C',
      swap: d === 'touch' ? '⇄' : d === 'pad' ? 'RB' : 'V'
    };
    return L[kind] || kind;
  }
};

// ---------------- Audio ----------------
const Audio2 = {
  ctx: null, master: null, musicGain: null, sfxGain: null, lp: null,
  buffer: null, src: null, el: null, rate: 1, started: false, loadState: 'none', noise: null,
  init() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.lp = this.ctx.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 20000;
      this.musicGain = this.ctx.createGain(); this.musicGain.connect(this.lp); this.lp.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
      const len = this.ctx.sampleRate * 1;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.applyVolumes();
      return true;
    } catch (e) { this.ctx = null; return false; }
  },
  unlock() {
    if (!this.init()) { this.fallbackMusic(); return; }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { } }
    if (this.loadState === 'none') this.loadMusic();
  },
  applyVolumes() {
    const s = Save.data.settings;
    if (this.musicGain) this.musicGain.gain.value = s.music * 0.75;
    if (this.sfxGain) this.sfxGain.gain.value = s.sfx * 0.6;
    if (this.el) this.el.volume = clamp(s.music * 0.75, 0, 1);
  },
  loadMusic() {
    this.loadState = 'loading';
    fetch('assets/music.mp3').then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => { const p = this.ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }))
      .then(buf => { this.buffer = buf; this.loadState = 'ready'; if (this.wantMusic) this.startMusic(); })
      .catch(() => { this.loadState = 'failed'; this.fallbackMusic(); });
  },
  fallbackMusic() {
    if (this.el) return;
    try {
      this.el = new Audio('assets/music.mp3'); this.el.loop = true; this.applyVolumes();
      if (this.wantMusic) { const p = this.el.play(); if (p && p.catch) p.catch(() => { }); }
    } catch (e) { this.el = null; }
  },
  wantMusic: false,
  music(rate) {
    this.wantMusic = true;
    if (rate) this.setRate(rate);
    if (this.buffer && !this.src) this.startMusic();
    if (this.el && this.el.paused) { const p = this.el.play(); if (p && p.catch) p.catch(() => { }); }
  },
  startMusic() {
    if (!this.ctx || !this.buffer || this.src) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buffer; s.loop = true;
    s.playbackRate.value = this.rate; s.connect(this.musicGain); s.start(0); this.src = s;
  },
  setRate(r) {
    this.rate = r;
    if (this.src) { try { this.src.playbackRate.setTargetAtTime(r, this.ctx.currentTime, 0.4); } catch (e) { this.src.playbackRate.value = r; } }
    if (this.el) { try { this.el.playbackRate = r; } catch (e) { } }
  },
  toneF: 20000,
  setTone(f) { this.toneF = f || 20000; if (this.lp && !this.muffled) { try { this.lp.frequency.setTargetAtTime(this.toneF, this.ctx.currentTime, 0.3); } catch (e) { } } },
  muffle(on) {
    this.muffled = on;
    if (this.lp) { try { this.lp.frequency.setTargetAtTime(on ? 700 : this.toneF, this.ctx.currentTime, 0.08); } catch (e) { } }
    if (this.el) this.el.volume = clamp(Save.data.settings.music * (on ? 0.3 : 0.75), 0, 1);
  },
  muffleOld(on) {
    if (this.lp) { try { this.lp.frequency.setTargetAtTime(on ? 700 : 20000, this.ctx.currentTime, 0.08); } catch (e) { } }
    if (this.el) this.el.volume = clamp(Save.data.settings.music * (on ? 0.3 : 0.75), 0, 1);
  },
  // ---- synth helpers ----
  tone(o) {
    const c = this.ctx; if (!c || c.state !== 'running') return;
    const t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.15;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 30; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.05); }
    const v = (o.vol || 0.2);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.sfxGain); osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noiseHit(o) {
    const c = this.ctx; if (!c || c.state !== 'running') return;
    const t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.1;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f0 || 1500, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(o.vol || 0.3, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
  },
  notes(list, o) { list.forEach((f, i) => this.tone(Object.assign({ f0: f, dur: 0.12, delay: i * (o.step || 0.07) }, o))); },
  play(name) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const S = this;
    switch (name) {
      case 'jump': S.tone({ type: 'square', f0: 330, f1: 720, dur: 0.13, vol: 0.09 }); break;
      case 'stomp': S.tone({ type: 'sine', f0: 700, f1: 110, dur: 0.12, vol: 0.35 }); S.noiseHit({ f0: 2200, dur: 0.05, vol: 0.25 }); break;
      case 'drop': S.tone({ type: 'triangle', f0: 1320, dur: 0.06, vol: 0.18 }); S.tone({ type: 'triangle', f0: 1760, dur: 0.12, vol: 0.18, delay: 0.05 }); break;
      case 'cherry': S.notes([784, 988, 1175, 1568, 1976], { type: 'triangle', vol: 0.2, step: 0.06, dur: 0.18 }); break;
      case 'power': S.notes([523, 659, 784, 1046, 1318, 1568], { type: 'square', vol: 0.07, step: 0.05, dur: 0.12 }); break;
      case 'hurt': S.tone({ type: 'sawtooth', f0: 520, f1: 130, dur: 0.32, vol: 0.12 }); break;
      case 'crack': S.noiseHit({ f0: 3000, dur: 0.15, vol: 0.3, ft: 'highpass' }); S.tone({ type: 'triangle', f0: 900, f1: 300, dur: 0.15, vol: 0.12 }); break;
      case 'die': S.notes([660, 520, 440, 330, 262], { type: 'square', vol: 0.08, step: 0.12, dur: 0.16 }); break;
      case 'shoot': S.tone({ type: 'square', f0: 900, f1: 260, dur: 0.09, vol: 0.08 }); break;
      case 'freeze': S.notes([1568, 2093, 2637], { type: 'sine', vol: 0.12, step: 0.04, dur: 0.2 }); S.noiseHit({ f0: 6000, dur: 0.2, vol: 0.12, ft: 'highpass' }); break;
      case 'boing': S.tone({ type: 'sine', f0: 180, f1: 620, dur: 0.28, vol: 0.28, vib: 18, vibAmt: 40 }); break;
      case 'break': S.noiseHit({ f0: 900, f1: 200, dur: 0.22, vol: 0.4, ft: 'lowpass' }); break;
      case 'check': S.notes([1046, 1318, 1568, 2093], { type: 'sine', vol: 0.18, step: 0.08, dur: 0.3 }); break;
      case 'oneup': S.notes([659, 784, 1318, 1046, 1175, 1568], { type: 'square', vol: 0.07, step: 0.08, dur: 0.12 }); break;
      case 'bossHit': S.tone({ type: 'square', f0: 260, f1: 60, dur: 0.3, vol: 0.18 }); S.noiseHit({ f0: 500, dur: 0.25, vol: 0.4, ft: 'lowpass' }); break;
      case 'thud': S.tone({ type: 'sine', f0: 120, f1: 40, dur: 0.35, vol: 0.5 }); S.noiseHit({ f0: 300, dur: 0.2, vol: 0.4, ft: 'lowpass' }); break;
      case 'slide': S.noiseHit({ f0: 800, f1: 3000, dur: 0.25, vol: 0.15 }); break;
      case 'crunch': for (let i = 0; i < 3; i++) S.noiseHit({ f0: 2500 + i * 600, dur: 0.04, vol: 0.35, delay: i * 0.045, ft: 'highpass' }); break;
      case 'throw': S.tone({ type: 'triangle', f0: 300, f1: 900, dur: 0.18, vol: 0.12 }); break;
      case 'note': S.notes([880, 1109, 1319, 1760], { type: 'sine', vol: 0.15, step: 0.1, dur: 0.4 }); break;
      case 'grab': S.tone({ type: 'triangle', f0: 400, f1: 250, dur: 0.08, vol: 0.15 }); break;
      case 'bump': S.tone({ type: 'square', f0: 160, f1: 90, dur: 0.08, vol: 0.12 }); break;
      case 'pop': S.tone({ type: 'sine', f0: 400, f1: 900, dur: 0.1, vol: 0.15 }); break;
      case 'pea': S.tone({ type: 'square', f0: 600, f1: 300, dur: 0.06, vol: 0.06 }); break;
      case 'tears': S.tone({ type: 'triangle', f0: 500, f1: 300, dur: 0.4, vol: 0.12, vib: 9, vibAmt: 60 }); break;
      case 'melt': S.tone({ type: 'sine', f0: 300, f1: 200, dur: 0.2, vol: 0.06, vib: 12, vibAmt: 20 }); break;
      case 'gate': S.tone({ type: 'square', f0: 90, f1: 70, dur: 0.5, vol: 0.12 }); S.noiseHit({ f0: 200, dur: 0.4, vol: 0.3, ft: 'lowpass' }); break;
      case 'sheep': S.tone({ type: 'sawtooth', f0: 520, f1: 470, dur: 0.35, vol: 0.06, vib: 28, vibAmt: 40 }); break;
      case 'ice': S.notes([1760, 2349], { type: 'sine', vol: 0.14, step: 0.05, dur: 0.15 }); break;
      case 'select': S.tone({ type: 'triangle', f0: 880, dur: 0.06, vol: 0.12 }); break;
      case 'win': S.notes([523, 659, 784, 1046, 784, 1046, 1318], { type: 'square', vol: 0.08, step: 0.11, dur: 0.18 }); break;
      case 'drip': S.tone({ type: 'sine', f0: 1200, f1: 500, dur: 0.08, vol: 0.06 }); break;
      case 'roar': S.tone({ type: 'sawtooth', f0: 110, f1: 70, dur: 0.6, vol: 0.12, vib: 14, vibAmt: 25 }); break;

// ================= levels.js : level builders =================
class LB {
  constructor(W, H) { this.L = new Level(W, H); this.ents = []; this.decoBack = []; this.decoFront = []; this.fake = []; }
  fill(c0, r0, c1, r1, t) { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) this.L.set(c, r, t); }
  ground(c0, c1, top, t) { this.fill(c0, top, c1, this.L.H - 1, t || TL.SOLID); }
  pit(c0, c1) { this.fill(c0, 0, c1, this.L.H - 1, TL.EMPTY); }
  slopeUp(c0, top, len, ice) { for (let i = 0; i < len; i++) { this.L.set(c0 + i, top - 1 - i, ice ? TL.SRI : TL.SR); this.fill(c0 + i, top - i, c0 + i, this.L.H - 1, TL.SOLID); } return top - len; }
  slopeDown(c0, top, len, ice) { for (let i = 0; i < len; i++) { this.L.set(c0 + i, top + i, ice ? TL.SLI : TL.SL); this.fill(c0 + i, top + i + 1, c0 + i, this.L.H - 1, TL.SOLID); } return top + len; }
  plat(c0, c1, r, t) { this.fill(c0, r, c1, r, t || TL.ONEWAY); }
  fakeRect(c0, r0, c1, r1) { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) { this.L.set(c, r, TL.FAKE); this.fake.push([c, r]); } }
  add(e) { this.ents.push(e); return e; }
  block(c, r, content, o) { const b = new Block(c, r, content, o); return this.add(b); }
  bricks(c0, c1, r) { for (let c = c0; c <= c1; c++) this.block(c, r, null, { kind: 'brick' }); }
  drop(c, r) { return this.add(new Pickup('drop', c * T + T / 2, r * T + T / 2)); }
  drops(c0, r, n, arc) { for (let i = 0; i < n; i++) { const k = n > 1 ? i / (n - 1) : 0.5; const lift = arc ? Math.sin(k * Math.PI) * arc : 0; this.add(new Pickup('drop', (c0 + i) * T + T / 2, r * T + T / 2 - lift)); } }
  item(kind, c, r, o) { return this.add(new Pickup(kind, c * T + T / 2, r * T + T / 2, o)); }
  hint(c, id, text, o) { this.add(new Hint(c * T, id, text, o)); }
}
const X = c => c * T + T / 2;   // tile column center
const Y = r => r * T;           // top of row

// ---------------- Touch controls ----------------
const Touch = {
  el: document.getElementById('touch'), visible: false,
  init() {
    const dpad = this.el.querySelector('.dpad');
    const zones = new Map();
    const setDir = () => { let l = false, r = false, d = false, u = false; for (const z of zones.values()) { if (z === 'l') l = true; if (z === 'r') r = true; if (z === 'd') d = true; if (z === 'u') u = true; if (z === 'ld') { l = true; d = true; } if (z === 'rd') { r = true; d = true; } } Input.touch.left = l; Input.touch.right = r; Input.touch.down = d; Input.touch.up = u; dpad.dataset.l = l; dpad.dataset.r = r; dpad.dataset.d = d; dpad.dataset.u = u; };
    const zoneOf = (e) => { const b = dpad.getBoundingClientRect(); const x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height; if (x < 0.34) return y > 0.78 ? 'ld' : 'l'; if (x > 0.66) return y > 0.78 ? 'rd' : 'r'; return y < 0.5 ? 'u' : 'd'; };
    dpad.addEventListener('pointerdown', e => { e.preventDefault(); Audio2.unlock(); Input.lastDevice = 'touch'; try { dpad.setPointerCapture(e.pointerId); } catch (_) { } zones.set(e.pointerId, zoneOf(e)); setDir(); });
    dpad.addEventListener('pointermove', e => { if (zones.has(e.pointerId)) { zones.set(e.pointerId, zoneOf(e)); setDir(); } });
    const up = e => { zones.delete(e.pointerId); setDir(); };
    dpad.addEventListener('pointerup', up); dpad.addEventListener('pointercancel', up); dpad.addEventListener('lostpointercapture', up);
    this.el.querySelectorAll('[data-act]').forEach(b => {
      const act = b.dataset.act; const ids = new Set();
      b.addEventListener('pointerdown', e => { e.preventDefault(); Audio2.unlock(); Input.lastDevice = 'touch'; try { b.setPointerCapture(e.pointerId); } catch (_) { } ids.add(e.pointerId); Input.touch[act] = true; b.classList.add('on'); });
      const off = e => { ids.delete(e.pointerId); if (!ids.size) { Input.touch[act] = false; b.classList.remove('on'); } };
      b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
    });
    this.el.querySelector('.tpause').addEventListener('pointerdown', e => { e.preventDefault(); G.pause(); });
    this.el.addEventListener('contextmenu', e => e.preventDefault());
  },
  update() {
    const s = Save.data.settings.touch;
    const want = (s === 'on' || (s === 'auto' && IS_TOUCH)) && (G.state === 'play' || G.state === 'levelIntro');
    this.visible = want;
    this.el.classList.toggle('on', want);
    if (!want) for (const k in Input.touch) Input.touch[k] = false;
    const fire = this.el.querySelector('[data-act="fire"]');
    if (fire) fire.style.visibility = (G.player && ((G.player.power === 'cherry' || G.player.power === 'mint') && G.player.char === 'banni' || G.player.state === 'balloon')) ? 'visible' : 'hidden';
    const sw = this.el.querySelector('[data-act="swap"]');
    if (sw) sw.style.display = (G.def && G.def.swap && G.level) ? 'flex' : 'none';
  }
};

// ---------------- layout ----------------
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const aspect = clamp(ww / wh, 4 / 3, 2.1);
  G.viewW = Math.round(VIEW_H * aspect);
  const scale = Math.min(ww / G.viewW, wh / VIEW_H);
  G.displayScale = scale;
  const cw = G.viewW * scale, ch = VIEW_H * scale;
  const dpr = window.devicePixelRatio || 1;
  G.S = clamp(Math.round(scale * dpr * 4) / 4, 0.75, 2);
  canvas.width = Math.round(G.viewW * G.S); canvas.height = Math.round(VIEW_H * G.S);
  const stage = document.getElementById('stage');
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  stage.style.left = ((ww - cw) / 2) + 'px'; stage.style.top = ((wh - ch) / 2) + 'px';
  stage.style.setProperty('--u', scale.toFixed(4));
  if (G.terrain) G.terrain.setScale(G.S);
  if (G.level && G.cam) { G.cam.maxX = G.bossActive ? G.cam.maxX : G.level.W * T - G.viewW; }
  document.getElementById('rotate').classList.toggle('on', IS_TOUCH && wh > ww * 1.1);
  if (UI.cur === 'map') UI.mapPanel();
}

// ---------------- boot ----------------
let lastT = performance.now(), accT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  accT += dt;
  let n = 0;
  while (!G.manual && accT >= DT && n < 5) { Input.update(); try { G.step(DT); } catch (e) { reportError(e); } accT -= DT; n++; }
  if (n >= 5) accT = 0;
  try { G.render(); } catch (e) { reportError(e); }
  if (G.state === 'play') { const f = G.player && ((G.player.power === 'cherry' || G.player.power === 'mint') && G.player.char === 'banni' || G.player.state === 'balloon'); if (f !== Touch.fireVis) { Touch.fireVis = f; Touch.update(); } }
}
let errShown = 0;
function reportError(e) { console.error(e); if (errShown++ < 1) { const d = document.getElementById('err'); d.textContent = 'Ошибка: ' + (e && e.message); d.style.display = 'block'; setTimeout(() => d.style.display = 'none', 6000); } }
async function boot() {
  Save.load(); Input.init(); Touch.init();
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { G.pause(); try { Audio2.ctx && Audio2.ctx.suspend(); } catch (e) { } } else { try { Audio2.ctx && Audio2.ctx.resume(); } catch (e) { } } });
  window.addEventListener('blur', () => G.pause());
  for (const ev of ['pointerdown', 'touchend', 'click']) document.addEventListener(ev, () => Audio2.unlock(), { passive: true });
  const fontP = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load('900 20px Nunito'), document.fonts.load('800 20px Nunito')]), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  await Promise.all([loadImage('bg1', 'assets/bg1.jpg'), loadImage('bg2', 'assets/bg2.jpg'), loadImage('map', 'assets/map.jpg'), fontP]);
  ['bg3', 'bg4', 'bg5', 'party'].forEach(k => loadImage(k, 'assets/' + k + '.jpg'));
  document.getElementById('loading').style.display = 'none';
  UI.title();
  requestAnimationFrame(frame);
}
boot();
window.__dbg = { Input, Save, Audio2, UI, Scenes, TL, LEVELS, Touch, HUD };

})();
</script>
