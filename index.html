<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Банни и Крошка: Путь через Сплит</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8C%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="touch">
    <div class="dpad"><i class="l">◀</i><span class="ud"><i class="u">▲</i><i class="d">▼</i></span><i class="r">▶</i></div>
    <div class="tb sw" data-act="swap">⇄</div>
    <div class="tb pk" data-act="pickle">🥒</div>
    <div class="tb fire" data-act="fire">🍒</div>
    <div class="tb jump" data-act="jump">⤒</div>
    <div class="tpause">❚❚</div>
  </div>
  <div id="ui"></div>
</div>
<div id="rotate">Поверни телефон горизонтально,<br>чтобы играть 🍌</div>
<div id="loading">Загрузка…</div>
<div id="err"></div>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
<script src="js/theme.js"></script>
<script src="js/theme2.js"></script>
<script src="js/entities.js"></script>
<script src="js/entities2.js"></script>
<script src="js/levels.js"></script>
<script src="js/levels2.js"></script>
<script src="js/worlds.js"></script>
<script src="js/w2/art.js"></script>
<script src="js/w2/theme.js"></script>
<script src="js/w2/water.js"></script>
<script src="js/w2/entities.js"></script>
<script src="js/w2/art2.js"></script>
<script src="js/w2/entities2.js"></script>
<script src="js/w2/levels.js"></script>
<script src="js/w2/levels2.js"></script>
<script src="js/main.js"></script>
</body>
</html>
